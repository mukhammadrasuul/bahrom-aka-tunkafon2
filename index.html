<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chek</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start;
            align-items: left;
            background-color: #f8f8f8;
        }

        .receipt-container {
            justify-content: flex-start;
            align-items: left;
        }

        .receipt {
            width: 65mm;
            padding: 0px;
            background-color: white;
        }

        .receipt-logo {
            text-align: center;
            padding: 4px 2mm 2px 2mm;
        }

        .receipt-logo img,
        .receipt-logo svg {
            width: 58mm;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .date-header {
            font-weight: bold;
            font-size: 12px;
            margin-top: 10px;
            margin-bottom: 5px;
            padding-left: 5px;
        }

        .line {
            border-bottom: 1px dashed black;
            margin: 10px 0;
        }

        .transaction-details {
            font-size: 10px;
            text-align: left;
            margin-bottom: 10px;
        }

        .transaction-details div {
            display: flex;
            justify-content: space-between;
            margin: 2px 5px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin: 5px;
            font-size: 12px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 10px;
            margin: 3px 5px;
            gap: 4px;
        }

        .item-number {
            margin-right: 3px;
            white-space: nowrap;
        }

        .item-name {
            flex-grow: 1;
            word-break: break-word;
        }

        .item-quantity {
            margin-right: 6px;
            text-align: right;
            white-space: nowrap;
        }

        .item-price {
            min-width: 65px;
            text-align: right;
            white-space: nowrap;
        }

        .total-section {
            font-weight: bold;
            font-size: 12px;
            margin: 5px;
        }

        .total-section .item span:last-child {
            white-space: nowrap;
        }

        .footer {
            margin-top: 20px;
            font-size: 10px;
            text-align: center;
        }
    </style>
</head>
<body onfocus="window.close()">
<div class="receipt-container">
    <div class="receipt" id="receipt"></div>
</div>

<script>
    var params = new URLSearchParams(window.location.search);

    // ---- Helpers (mirroring the PHP functions) ----

    // PHP urldecode(): '+' becomes space, %XX decoded. Safe fallback on error.
    function phpUrldecode(str) {
        try {
            return decodeURIComponent(String(str).replace(/\+/g, ' '));
        } catch (e) {
            return String(str);
        }
    }

    // cleanInput(): trim(urldecode($str))
    function cleanInput(str) {
        return phpUrldecode(str).trim();
    }

    // Get a parameter, split by comma, clean each piece. [] if missing.
    function getCleanList(name) {
        var v = params.get(name);
        return v === null ? [] : v.split(',').map(cleanInput);
    }

    // Get a single cleaned parameter value
    function getClean(name) {
        var v = params.get(name);
        return v === null ? '' : cleanInput(v);
    }

    // Clean numeric strings (removes commas, spaces, non-breaking spaces)
    function cleanNumberString(v) {
        if (v === null || typeof v === 'undefined') return '0';
        return String(v).replace(/[,\s\u00A0]/g, '').trim();
    }

    // Safe integer parser supporting large numbers (> 100,000,000)
    function intval(v) {
        var n = Math.round(parseFloat(cleanNumberString(v)));
        return isNaN(n) ? 0 : n;
    }

    // Safe float parser supporting large numbers (> 100,000,000)
    function floatval(v) {
        var n = parseFloat(cleanNumberString(v));
        return isNaN(n) ? 0 : n;
    }

    // PHP number_format($n, decimals, '.', ',')
    function numberFormat(value, decimals) {
        decimals = decimals || 0;
        var n = parseFloat(value);
        if (isNaN(n)) n = 0;
        return n.toLocaleString('en-US', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        });
    }

    // PHP substr($s, start, length)
    function substr(s, start, length) {
        s = String(s);
        return s.substring(start, start + length);
    }

    // PHP htmlspecialchars()
    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    // ---- Extract data ----
    var tovar   = getCleanList('tovar');
    var miqdori = getCleanList('miqdori');
    var jami    = getCleanList('jami');
    var narxi   = getCleanList('narxi');
    var sana    = getCleanList('sana');

    var usta    = getClean('usta') || getClean('mijoz');
    var obyekt  = getClean('obyekt');
    var telefon = getClean('telefon');

    // ---- Group items by date ----
    var groupedData = {};
    var calculatedHammasi = 0;

    for (var i = 0; i < tovar.length; i++) {
        var currentDate = sana[i] || sana[0] || '';
        if (!tovar[i]) continue;

        if (!groupedData[currentDate]) groupedData[currentDate] = [];

        if (typeof miqdori[i] !== 'undefined' &&
            typeof jami[i] !== 'undefined' &&
            typeof narxi[i] !== 'undefined') {
            var itemJami  = floatval(jami[i]);
            var itemNarxi = floatval(narxi[i]);
            calculatedHammasi += itemJami;

            groupedData[currentDate].push({
                tovar: tovar[i],
                miqdori: miqdori[i],
                jami: itemJami,
                narxi: itemNarxi
            });
        }
    }

    // Sort dates (replaces ksort)
    var dates = Object.keys(groupedData).sort();

    // Clean logo markup (uses "uychi tunkafon.jpg" if available, otherwise crisp SVG)
    var logoHtml = '<div class="receipt-logo">'
        + '<img src="uychi tunkafon.jpg" alt="Uychi Tunkafon Markazi" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';" />'
        + '<svg style="display:none;" viewBox="0 0 960 350" xmlns="http://www.w3.org/2000/svg">'
        +   '<polygon points="20,170 175,20 250,92 250,48 282,48 282,123 330,170 288,170 175,60 62,170" fill="#F97300"/>'
        +   '<path d="M 255 169 A 92 92 0 1 0 175 307 L 575 307" fill="none" stroke="#031B59" stroke-width="28" stroke-linecap="butt"/>'
        +   '<rect x="136" y="184" width="28" height="28" fill="#031B59"/>'
        +   '<rect x="171" y="184" width="28" height="28" fill="#031B59"/>'
        +   '<rect x="136" y="219" width="28" height="28" fill="#031B59"/>'
        +   '<rect x="171" y="219" width="28" height="28" fill="#031B59"/>'
        +   '<text x="228" y="244" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="74" fill="#031B59">UYCHI TUNKAFON</text>'
        +   '<text x="598" y="316" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="46" letter-spacing="10" fill="#031B59">MARKAZI</text>'
        + '</svg>'
        + '</div>';

    // ---- Render ----
    var html = '';
    html += logoHtml;
    html += '<div class="line"></div>';

    var phoneFormatted = substr(telefon, 0, 2) + ' ' + substr(telefon, 2, 3) + ' ' +
                         substr(telefon, 5, 2) + ' ' + substr(telefon, 7, 2);
    html += '<div class="transaction-details">'
          +   '<div><span>Usta ismi:</span><span>' + esc(usta) + '</span></div>'
          +   '<div><span>Obyekt nomi:</span><span>' + esc(obyekt) + '</span></div>'
          +   '<div><span>Telefon raqam:</span><span>' + esc(phoneFormatted) + '</span></div>'
          + '</div>';
    html += '<div class="line"></div>';
    html += '<div class="item-header"><span>Tovarlar</span><span>Yig\'indisi</span></div>';

    dates.forEach(function (date) {
        if (date) {
            html += '<div class="date-header">' + esc(date) + '</div>';
        }
        var counter = 1;
        groupedData[date].forEach(function (item) {
            html += '<div class="item">'
                  +   '<div class="item-number">' + counter + ')</div>'
                  +   '<div class="item-name">' + esc(item.tovar) + '</div>'
                  +   '<div class="item-quantity">' + esc(item.miqdori) + ' x ' + numberFormat(item.narxi, 0) + '</div>'
                  +   '<div class="item-price">' + numberFormat(item.jami, 0) + '</div>'
                  + '</div>';
            counter++;
        });
    });

    html += '<div class="line"></div>';

    // kvadrat / nerjavinka (2 decimals)
    var sq = '';
    if (floatval(getClean('kvadrat')) > 0)
        sq += '<div class="item"><span>Jami kvadrat:</span><span>' + numberFormat(floatval(getClean('kvadrat')), 2) + '</span></div>';
    if (floatval(getClean('nerjavinka')) > 0)
        sq += '<div class="item"><span>Nerjavinka kvadrat:</span><span>' + numberFormat(floatval(getClean('nerjavinka')), 2) + '</span></div>';
    html += '<div class="total-section">' + sq + '</div>';

    html += '<div class="line"></div>';

    // Totals
    var totalHammasi = floatval(getClean('hammasi')) || calculatedHammasi;
    var obyektQarzi  = floatval(getClean('qarz'));
    var oziQarzi     = floatval(getClean('ozi_qarzi'));

    var totals = '';
    totals += '<div class="item"><span>Jami:</span><span>' + numberFormat(totalHammasi, 0) + '</span></div>';
    totals += '<div class="item"><span>To\'landi:</span><span>' + numberFormat(floatval(getClean('paid')), 0) + '</span></div>';
    if (floatval(getClean('dollar')) > 0)
        totals += '<div class="item"><span>To\'landi (dollar):</span><span>' + numberFormat(floatval(getClean('dollar')), 0) + '</span></div>';
    if (obyektQarzi > 0)
        totals += '<div class="item"><span>Obyekt qarzi:</span><span>' + numberFormat(obyektQarzi, 0) + '</span></div>';
    if (oziQarzi > 0)
        totals += '<div class="item"><span>O\'zi olgan qarzi:</span><span>' + numberFormat(oziQarzi, 0) + '</span></div>';
    if (floatval(getClean('qaytim')) > 0)
        totals += '<div class="item"><span>Qaytim:</span><span>' + numberFormat(floatval(getClean('qaytim')), 0) + '</span></div>';
    html += '<div class="total-section">' + totals + '</div>';

    html += '<div class="line"></div>';
    html += '<div class="footer">'
          +   'Bizni tanlaganingiz uchun rahmat!<br><br>'
          +   'Ulug\'bek +998 95 116 77 88 <br>'
          +   '<span style="display: inline-block; padding-left: 45px;">+998 99 264 44 44</span>'
          + '</div>';

    document.getElementById('receipt').innerHTML = html;

    // Auto-print after layout
    window.addEventListener('load', function () {
        window.print();
    });
</script>
</body>
</html>
